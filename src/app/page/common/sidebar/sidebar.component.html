<div class="flex">
<div class="w-80 bg-white border-none h-screen py-9 px-9">
  <div class="p-4 flex justify-between items-center">
    <h2 class="text-lg font-size text-gray-700">Workspaces</h2>
    <button class="text-gray-500 hover:bg-gray-100 p-1 rounded-full">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
    </button>
  </div>
  <div class="space-y-1">
    <div *ngFor="let workspace of workspaces" class="px-3">
      <div class="flex items-center justify-between py-2 cursor-pointer hover:bg-gray-50 rounded-md">
        <div class="flex items-center">
          <div class="w-8 h-8 rounded-md bg-blue-600 flex items-center justify-center text-white font-bold">
            {{ workspace.initial }}
          </div>
          <span class="ml-3 text-gray-700">{{ workspace.name }}</span>
        </div>
        <button (click)="toggleExpand(workspace)" class="text-gray-500">
          <svg *ngIf="workspace.expanded" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd" />
          </svg>
          <svg *ngIf="!workspace.expanded" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>

      </div>

      <div *ngIf="workspace.expanded" class="ml-10 space-y-1 mt-1">
        <div *ngFor="let item of menuItems" class="flex items-center py-2 px-2 text-gray-600 hover:bg-gray-50 rounded-md cursor-pointer">
          <i [class]=item.icon  class="h-5 w-5"></i>
          <span class="ml-3">{{ item.label }}</span>
        </div>
      </div>
    </div>
  </div>
</div>


  <div class="flex-1 bg-white p-9">
    <h2 class="text-2xl font-bold">Contenido Principal</h2>
    <p class="mt-4">Este es el área donde se muestra el contenido cuando se selecciona un workspace o un elemento del menú.</p>
  </div>
</div>
