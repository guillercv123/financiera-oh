<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="flex justify-center">
      <img src="assets/image/logo.svg" class="text-red-500" width="100" height="100" alt="">
    </div>
    <h2 class="text-1xl font-bold mb-6 text-center">Iniciar sesión para continuar</h2>
    <form [formGroup]="loginFormPresenter.loginForm" (ngSubmit)="loggerIn()">
      <div class="mb-4">
        <input
          type="email"
          id="email"
          placeholder="Introduce tu correo electrónico"
          formControlName="email"
          class="w-full
          px-4 py-2
          border border-gray-300 rounded-lg
          focus:outline-none focus:ring-2 focus:ring-blue-500
          placeholder-gray-400"
        />
      </div>
      <div class="mb-6">
        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400"
        />
      </div>
      <button
        type="submit"
        [disabled]="loginFormPresenter.loginForm.invalid"
        class="w-full text-white py-2 rounded-lg transition
         bg-blue-600 hover:bg-blue-700
         disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed"
      >
        Iniciar sesión
      </button>
    </form>
    <div class="flex gap-2 text-base font-medium mt-6 items-center justify-center">
      <a href="/register" class="text-blue-600 text-sm font-medium hover:underline transition-colors duration-300">¿No puedes iniciar sesión?</a>
      <a href="/register" class="text-blue-600 text-sm font-medium hover:underline transition-colors duration-300">Crear nueva cuenta</a>
    </div>
  </div>
</div>
