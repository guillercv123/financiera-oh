<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <div class="flex justify-center">
      <img src="assets/image/logo.svg" class="text-red-500" width="100" height="100" alt="">
    </div>
    <h2 class="text-1xl font-bold mb-6 text-center">Iniciar sesión para continuar</h2>
    <form [formGroup] = "registerFormPresenter.registerForm" (ngSubmit)="createUser()">
      <div class="mb-4">
        <input
          type="text"
          id="fullName"
          placeholder="Nombre y Apellidos"
          formControlName="fullName"
          class="w-full
          px-4 py-2
          border border-gray-300 rounded-lg
          focus:outline-none focus:ring-2 focus:ring-blue-500
          placeholder-gray-400"
        />
      </div>
      <div class="mb-4">
        <input
          type="email"
          id="email"
          placeholder="Introduce tu correo electrónico"
          formControlName="email"
          class="w-full
          px-4 py-2
          border border-gray-300 rounded-lg
          focus:outline-none focus:ring-2 focus:ring-blue-500
          placeholder-gray-400"
        />
      </div>
      <div class="mb-6">
        <input
          type="password"
          id="password"
          placeholder="Contraseña"
          formControlName="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400"
        />
      </div>
      <div class="mb-6">
        <input
          type="password"
          id="confirmPassword"
          placeholder="confirmar contraseña"
          formControlName="confirmPassword"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-gray-400"
        />
      </div>
      <button
        type="submit"
        [disabled]="registerFormPresenter.registerForm.invalid"
        class="w-full text-white py-2 rounded-lg transition
         bg-blue-600 hover:bg-blue-700
         disabled:bg-gray-300 disabled:text-gray-500 disabled:cursor-not-allowed"
      >
        Registrar
      </button>
    </form>
  </div>
</div>
